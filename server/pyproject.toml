[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "fastembed",
    "sqlite-vec",
    "pyyaml",
]

[project.scripts]
wiki-mcp = "wiki_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_mcp"]
